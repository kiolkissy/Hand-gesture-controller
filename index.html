<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Volume Knob</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="container">
        <h1>Gesture Carousel Control</h1>
        <p class="instruction">👈 Flick Left: Previous Card | 👉 Flick Right: Next Card</p>

        <!-- Carousel Display -->
        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </div>

        <!-- Gesture Feedback -->
        <div class="gesture-feedback" id="gestureFeedback"></div>

        <!-- Hidden video element for MediaPipe -->
        <video class="input_video" id="inputVideo" playsinline style="display: none;"></video>
        <!-- Canvas for landmarks debugging (optional, hidden by default but useful) -->
        <canvas class="output_canvas" id="outputCanvas" width="320" height="240"></canvas>
    </div>

    <script src="script.js"></script>
</body>

</html>
